<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#5a4218" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Design cabinets and furniture in your browser. Optimize cut lists, preview projects, and export build plans, BOMs, DXF, and G-code in six languages."
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://rajwanyair.github.io/WoodworkingShop/" />
    <link rel="preload" href="./docs/banner.svg" as="image" type="image/svg+xml" fetchpriority="high" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Cabinet Planner — Woodworking Design Tool" />
    <meta
      property="og:description"
      content="Design cabinets and furniture in your browser. Optimize cut lists, preview projects, and export build plans, BOMs, DXF, and G-code in six languages."
    />
    <meta property="og:url" content="https://rajwanyair.github.io/WoodworkingShop/" />
    <meta property="og:site_name" content="Cabinet Planner" />
    <meta property="og:image" content="https://rajwanyair.github.io/WoodworkingShop/icon-512.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:alt" content="Cabinet Planner — woodworking design tool icon" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Cabinet Planner — Woodworking Design Tool" />
    <meta
      name="twitter:description"
      content="Design cabinets and furniture in your browser. Optimize cut lists, preview projects, and export build plans, BOMs, DXF, and G-code in six languages."
    />
    <meta name="twitter:image" content="https://rajwanyair.github.io/WoodworkingShop/icon-512.png" />

    <!-- Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Cabinet Planner",
        "description": "Design cabinets and furniture in your browser. Optimize cut lists, preview projects, and export build plans, BOMs, DXF, and G-code in six languages.",
        "url": "https://rajwanyair.github.io/WoodworkingShop/",
        "applicationCategory": "DesignApplication",
        "operatingSystem": "Any",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "inLanguage": ["en", "he", "ar", "de", "es", "fr"]
      }
    </script>

    <!-- v3.40.0: preconnect to CDNs used at runtime (react-pdf Twemoji, cdnjs) -->
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin="anonymous" />
    <link rel="dns-prefetch" href="https://cdnjs.cloudflare.com" />

    <title>Cabinet Planner — Woodworking Design Tool</title>

    <!-- Content Security Policy (v3.62.0 — Phase 12 / Sprint 16: added CSP report-to via _headers)
         Authoritative CSP lives in public/_headers (Cloudflare Pages HTTP header) and includes
         report-to + report-uri directives pointing at the companion CSP Worker endpoint.
         This <meta> tag acts as a fallback for non-CF-Pages environments (local dev, file:// preview).
         report-to / report-uri are not supported in <meta> tags and are deliberately omitted here.
         script-src: 'wasm-unsafe-eval' required for WebAssembly (cut-optimizer).
                     cloudflareinsights.com: Cloudflare Web Analytics beacon (privacy-first, no cookies).
         style-src 'unsafe-inline': Tailwind v4 injects critical CSS inline.
         worker-src blob: : Vite wraps workers in blob URLs in dev mode.
         connect-src cdnjs/cloudflareinsights/csp-worker: react-pdf Twemoji + CF beacon + CSP reports. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; worker-src 'self' blob:; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' data: blob: https://cdnjs.cloudflare.com https://cloudflareinsights.com https://csp.cabinet-planner.workers.dev; object-src 'none'; base-uri 'self'; form-action 'self'"
    />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p class="noscript-msg">Cabinet Planner requires JavaScript to run. Please enable JavaScript in your browser.</p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
    <!-- SW registration moved to external file to avoid unsafe-inline in script-src -->
  </body>
</html>
