<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/WoodworkingShop/favicon.svg" />
    <link rel="apple-touch-icon" href="/WoodworkingShop/icon-192.png" />
    <link rel="manifest" href="/WoodworkingShop/manifest.json" />
    <meta name="theme-color" content="#5a4218" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Interactive woodworking cabinet design tool with smart cut optimization, PDF export, and bilingual support."
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://rajwanyair.github.io/WoodworkingShop/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Cabinet Planner — Woodworking Design Tool" />
    <meta
      property="og:description"
      content="Design custom cabinets and bookshelves with smart cut optimization, 3D preview, DXF export, and step-by-step assembly guides."
    />
    <meta property="og:url" content="https://rajwanyair.github.io/WoodworkingShop/" />
    <meta property="og:site_name" content="Cabinet Planner" />
    <meta property="og:image" content="https://rajwanyair.github.io/WoodworkingShop/icon-512.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:alt" content="Cabinet Planner — woodworking design tool icon" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Cabinet Planner — Woodworking Design Tool" />
    <meta name="twitter:description" content="Design custom cabinets with smart cut optimization and PDF export." />
    <meta name="twitter:image" content="https://rajwanyair.github.io/WoodworkingShop/icon-512.png" />

    <!-- Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Cabinet Planner",
        "description": "Interactive woodworking cabinet design tool with smart cut optimization, 3D preview, DXF export, and bilingual support.",
        "url": "https://rajwanyair.github.io/WoodworkingShop/",
        "applicationCategory": "DesignApplication",
        "operatingSystem": "Any",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "inLanguage": ["en", "he"]
      }
    </script>

    <!-- v3.24.0: preload static assets to eliminate render-blocking fetches -->
    <link rel="preload" href="/WoodworkingShop/manifest.json" as="fetch" crossorigin="anonymous" />
    <link rel="preload" href="/WoodworkingShop/icon-192.png" as="image" type="image/png" />

    <!-- v3.40.0: preconnect to CDNs used at runtime (react-pdf Twemoji, cdnjs) -->
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin="anonymous" />
    <link rel="dns-prefetch" href="https://cdnjs.cloudflare.com" />

    <title>Cabinet Planner — Woodworking Design Tool</title>

    <!-- Content Security Policy (v3.53.33)
         script-src: 'wasm-unsafe-eval' required for WebAssembly (cut-optimizer).
         style-src 'unsafe-inline': Tailwind v4 injects critical CSS inline.
         worker-src blob: : Vite wraps workers in blob URLs in dev mode.
         connect-src cdnjs: react-pdf may fetch Twemoji font at runtime. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; worker-src 'self' blob:; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' blob: https://cdnjs.cloudflare.com; object-src 'none'; base-uri 'self'; form-action 'self'"
    />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p class="noscript-msg">Cabinet Planner requires JavaScript to run. Please enable JavaScript in your browser.</p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
    <!-- SW registration moved to external file to avoid unsafe-inline in script-src -->
    <script src="/WoodworkingShop/sw-register.js" defer></script>
  </body>
</html>
