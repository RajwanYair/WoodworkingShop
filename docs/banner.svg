<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" width="1200" height="220">
  <defs>
    <!-- Main background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#1a0e06"/>
      <stop offset="45%"  stop-color="#2d1a0e"/>
      <stop offset="100%" stop-color="#4a2a12"/>
    </linearGradient>
    <!-- Amber accent gradient -->
    <linearGradient id="amber" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#b8722a"/>
      <stop offset="50%"  stop-color="#f0b060"/>
      <stop offset="100%" stop-color="#c07830"/>
    </linearGradient>
    <!-- Left vertical accent -->
    <linearGradient id="acV" x1="0" y1="0" x2="0" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#f0b060"/>
      <stop offset="100%" stop-color="#8b5022"/>
    </linearGradient>
    <!-- Cabinet face wood gradient -->
    <linearGradient id="cabFace" x1="0" y1="0" x2="150" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#4a2810"/>
      <stop offset="50%"  stop-color="#6b3a18"/>
      <stop offset="100%" stop-color="#4a2810"/>
    </linearGradient>
    <!-- Door panel gradient -->
    <linearGradient id="door" x1="0" y1="0" x2="60" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#3d1e08"/>
      <stop offset="40%"  stop-color="#5c3018"/>
      <stop offset="100%" stop-color="#3d1e08"/>
    </linearGradient>
    <!-- Right subtle glow for text area -->
    <radialGradient id="textGlow" cx="60%" cy="50%" r="50%" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#3d2010" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#1a0e06" stop-opacity="0"/>
    </radialGradient>
    <!-- Clip for rounded corners -->
    <clipPath id="rounded">
      <rect width="1200" height="220" rx="12"/>
    </clipPath>
  </defs>

  <!-- Background + glow -->
  <rect width="1200" height="220" fill="url(#bg)" rx="12"/>
  <rect width="1200" height="220" fill="url(#textGlow)" rx="12"/>

  <!-- Wood grain texture lines -->
  <g clip-path="url(#rounded)" opacity="0.25">
    <path d="M0,28  Q400,22  800,30  Q1000,33 1200,28"  stroke="#6b3a18" stroke-width="1.2" fill="none"/>
    <path d="M0,60  Q300,56  700,63  Q950,66 1200,60"  stroke="#6b3a18" stroke-width="0.9" fill="none"/>
    <path d="M0,95  Q450,90  800,97  Q1050,100 1200,95" stroke="#6b3a18" stroke-width="1.1" fill="none"/>
    <path d="M0,130 Q350,126 750,133 Q1000,136 1200,130" stroke="#6b3a18" stroke-width="0.8" fill="none"/>
    <path d="M0,168 Q500,163 850,170 Q1050,173 1200,168" stroke="#6b3a18" stroke-width="1.0" fill="none"/>
    <path d="M0,200 Q300,197 700,202 Q950,204 1200,200" stroke="#6b3a18" stroke-width="0.7" fill="none"/>
  </g>

  <!-- Left accent strip -->
  <rect x="0" y="0" width="6" height="220" fill="url(#acV)" rx="3"/>

  <!-- ══ Cabinet illustration (front + isometric hint) ══ -->
  <!-- Shadow -->
  <ellipse cx="148" cy="206" rx="60" ry="7" fill="#000" opacity="0.35"/>

  <!-- Carcass body -->
  <rect x="38" y="14" width="152" height="176" rx="4" fill="url(#cabFace)" stroke="#c08040" stroke-width="2"/>

  <!-- Iso top face -->
  <polygon points="38,14 190,14 206,2 54,2"
    fill="#8b5a28" fill-opacity="0.55" stroke="#d09050" stroke-width="1.2"/>
  <!-- Iso right face -->
  <polygon points="190,14 206,2 206,158 190,172"
    fill="#5a3010" fill-opacity="0.6" stroke="#c08040" stroke-width="1.2"/>

  <!-- Toe kick -->
  <rect x="46" y="178" width="136" height="10" rx="2"
    fill="#2d1608" stroke="#9a6030" stroke-width="1" opacity="0.9"/>

  <!-- Center stile (door divider) -->
  <line x1="114" y1="16" x2="114" y2="176" stroke="#c08040" stroke-width="2" opacity="0.7"/>

  <!-- Shelf line (dashed) -->
  <line x1="42" y1="100" x2="186" y2="100"
    stroke="#d09050" stroke-width="1.2" stroke-dasharray="5,3" opacity="0.5"/>

  <!-- Left door -->
  <rect x="44" y="18" width="67" height="158" rx="2" fill="url(#door)" opacity="0.95"/>
  <!-- Left door inset panel -->
  <rect x="52" y="28" width="51" height="68" rx="2" fill="none" stroke="#a07040" stroke-width="1" opacity="0.6"/>
  <rect x="52" y="104" width="51" height="64" rx="2" fill="none" stroke="#a07040" stroke-width="1" opacity="0.6"/>
  <!-- Left handle -->
  <rect x="104" y="90" width="6" height="24" rx="3" fill="#e8a850"/>
  <circle cx="107" cy="90"  r="3.5" fill="#f0b860"/>
  <circle cx="107" cy="114" r="3.5" fill="#f0b860"/>

  <!-- Right door -->
  <rect x="117" y="18" width="69" height="158" rx="2" fill="url(#door)" opacity="0.95"/>
  <!-- Right door inset panel -->
  <rect x="124" y="28" width="54" height="68" rx="2" fill="none" stroke="#a07040" stroke-width="1" opacity="0.6"/>
  <rect x="124" y="104" width="54" height="64" rx="2" fill="none" stroke="#a07040" stroke-width="1" opacity="0.6"/>
  <!-- Right handle -->
  <rect x="117" y="90" width="6" height="24" rx="3" fill="#e8a850"/>
  <circle cx="120" cy="90"  r="3.5" fill="#f0b860"/>
  <circle cx="120" cy="114" r="3.5" fill="#f0b860"/>

  <!-- Hinges left door -->
  <rect x="40" y="42" width="8" height="12" rx="1.5" fill="#c09050" opacity="0.85"/>
  <rect x="40" y="142" width="8" height="12" rx="1.5" fill="#c09050" opacity="0.85"/>
  <!-- Hinges right door -->
  <rect x="180" y="42" width="8" height="12" rx="1.5" fill="#c09050" opacity="0.85"/>
  <rect x="180" y="142" width="8" height="12" rx="1.5" fill="#c09050" opacity="0.85"/>

  <!-- Dimension annotations (decorative) -->
  <line x1="32" y1="14" x2="32" y2="188" stroke="#e8a850" stroke-width="0.8" opacity="0.5"/>
  <line x1="28" y1="14"  x2="36" y2="14"  stroke="#e8a850" stroke-width="0.8" opacity="0.5"/>
  <line x1="28" y1="188" x2="36" y2="188" stroke="#e8a850" stroke-width="0.8" opacity="0.5"/>
  <text x="20" y="102" font-family="monospace" font-size="9" fill="#e8a850" opacity="0.65"
    transform="rotate(-90,20,102)" text-anchor="middle">720mm</text>

  <!-- ══ Main text block ══ -->
  <!-- "Cabinet Planner" -->
  <text x="250" y="92"
    font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif"
    font-size="58" font-weight="800" fill="#f8e8d0" letter-spacing="-2"
    opacity="0.97">Cabinet Planner</text>

  <!-- Underline accent -->
  <rect x="250" y="100" width="550" height="3.5" fill="url(#amber)" rx="2" opacity="0.9"/>

  <!-- Version badge -->
  <rect x="830" y="66" width="80" height="22" rx="11" fill="#8b5022" opacity="0.9"/>
  <text x="870" y="81"
    font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-weight="600"
    fill="#f0b060" text-anchor="middle">v3.7.0</text>

  <!-- Tagline -->
  <text x="250" y="133"
    font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif"
    font-size="17" fill="#c8966a" letter-spacing="0.3">
    Browser-based woodworking design · No install · No account · Free
  </text>

  <!-- Feature pills row -->
  <!-- Pill 1 -->
  <rect x="250" y="153" width="112" height="22" rx="11" fill="#3d1e08" stroke="#8b5022" stroke-width="1"/>
  <text x="306" y="168" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#e8a060" text-anchor="middle">MaxRects Optimizer</text>
  <!-- Pill 2 -->
  <rect x="370" y="153" width="90" height="22" rx="11" fill="#3d1e08" stroke="#8b5022" stroke-width="1"/>
  <text x="415" y="168" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#e8a060" text-anchor="middle">PDF · DXF · G-code</text>
  <!-- Pill 3 -->
  <rect x="468" y="153" width="82" height="22" rx="11" fill="#3d1e08" stroke="#8b5022" stroke-width="1"/>
  <text x="509" y="168" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#e8a060" text-anchor="middle">6-view Preview</text>
  <!-- Pill 4 -->
  <rect x="558" y="153" width="78" height="22" rx="11" fill="#3d1e08" stroke="#8b5022" stroke-width="1"/>
  <text x="597" y="168" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#e8a060" text-anchor="middle">PWA Offline</text>
  <!-- Pill 5 -->
  <rect x="644" y="153" width="82" height="22" rx="11" fill="#3d1e08" stroke="#8b5022" stroke-width="1"/>
  <text x="685" y="168" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#e8a060" text-anchor="middle">EN + HE (RTL)</text>
  <!-- Pill 6 -->
  <rect x="734" y="153" width="78" height="22" rx="11" fill="#3d1e08" stroke="#8b5022" stroke-width="1"/>
  <text x="773" y="168" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#e8a060" text-anchor="middle">258+ Tests</text>
  <!-- Pill 7 -->
  <rect x="820" y="153" width="68" height="22" rx="11" fill="#3d1e08" stroke="#8b5022" stroke-width="1"/>
  <text x="854" y="168" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#e8a060" text-anchor="middle">MIT License</text>

  <!-- Stack logos area (right side) -->
  <text x="920" y="92"
    font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#9a6840" text-anchor="middle"
    opacity="0.8">Built with</text>
  <!-- React badge -->
  <rect x="860" y="100" width="56" height="20" rx="4" fill="#20232a" opacity="0.8"/>
  <text x="888" y="114" font-family="monospace" font-size="10" fill="#61dafb" text-anchor="middle">React 19</text>
  <!-- TS badge -->
  <rect x="922" y="100" width="66" height="20" rx="4" fill="#3178c6" opacity="0.85"/>
  <text x="955" y="114" font-family="monospace" font-size="10" fill="#fff" text-anchor="middle">TypeScript 5</text>
  <!-- Vite badge -->
  <rect x="860" y="126" width="56" height="20" rx="4" fill="#1a1a2e" opacity="0.85"/>
  <text x="888" y="140" font-family="monospace" font-size="10" fill="#646cff" text-anchor="middle">Vite 6</text>
  <!-- TW badge -->
  <rect x="922" y="126" width="66" height="20" rx="4" fill="#0f172a" opacity="0.85"/>
  <text x="955" y="140" font-family="monospace" font-size="10" fill="#38bdf8" text-anchor="middle">Tailwind 4</text>

  <!-- Bottom accent bar -->
  <rect x="6" y="212" width="1188" height="5" fill="url(#amber)" rx="2.5" opacity="0.7"/>
</svg>
