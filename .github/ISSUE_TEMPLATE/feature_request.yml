name: 🚀 Feature Request
description: Suggest a new feature or enhancement
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement to Cabinet Planner!
        Check the [Roadmap](https://github.com/RajwanYair/WoodworkingShop/blob/main/ROADMAP.md) — your idea may already be planned.

  - type: dropdown
    id: area
    attributes:
      label: "🗂 Area"
      description: Which part of the app would this improve?
      options:
        - Configurator (new controls, presets, materials)
        - Preview (new view, export format)
        - Cut-sheet Optimizer
        - Assembly Guide
        - PDF Export
        - Engine (new computation, furniture type)
        - i18n / Accessibility
        - Performance / PWA
        - CI / Developer tooling
        - Other
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: "💡 Feature summary"
      description: One-sentence description of what you want.
      placeholder: "Add X so that users can Y."
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: "🎯 Motivation"
      description: Why is this useful? What problem does it solve?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: "🔧 Proposed solution"
      description: How should it work? Include example configs, mockups, or links.
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: "🔀 Alternatives considered"
      description: Any other approaches you've thought about?
    validations:
      required: false
