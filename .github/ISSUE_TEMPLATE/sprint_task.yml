name: 🗂️ Sprint Task
description: Track one roadmap sprint deliverable
title: '[Sprint ${sprintId}] '
labels: ['sprint', 'roadmap']
body:
  - type: markdown
    attributes:
      value: |
        Create one issue before implementation for a single roadmap sprint item.
        Link the relevant section in [ROADMAP.md](../blob/main/ROADMAP.md). Use a dedicated issue branch and submit a reviewed PR; never push feature work directly to main.

  - type: input
    id: sprint
    attributes:
      label: '🏃 Sprint number'
      placeholder: 'e.g. 89'
    validations:
      required: true

  - type: input
    id: phase
    attributes:
      label: '🗺️ Phase'
      placeholder: 'e.g. Phase 21'
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: '📝 Deliverable description'
      description: One sentence describing what will be built or changed.
      placeholder: 'Implement the Project Build Log panel (engine + store + UI + i18n + tests)'
    validations:
      required: true

  - type: dropdown
    id: type
    attributes:
      label: '🔖 Deliverable type'
      options:
        - Feature (engine + store + UI)
        - Tests
        - Refactor
        - CI / Workflow
        - Docs
        - Release
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: '✅ Acceptance criteria'
      description: List verifiable checkboxes. Sprint completion requires merged PR evidence.
      value: |
        - [ ] PR references this issue and records acceptance evidence
        - [ ] Required review and checks pass before merge
        - [ ] `npm run quality` → 0 errors, 0 warnings
        - [ ] `npm test` → all pass
        - [ ] `npm run dead:check` → no orphaned exports
        - [ ] `ROADMAP.md` sprint item marked DONE
        - [ ] `CHANGELOG.md [Unreleased]` entry added
    validations:
      required: true

  - type: input
    id: roadmap_link
    attributes:
      label: '🔗 ROADMAP.md section'
      placeholder: 'Phase 21 · Sprint 89'

  - type: textarea
    id: dependencies
    attributes:
      label: '🔗 Dependencies / related issues'
      description: List blockers, prerequisite issues, and related work; keep unrelated items in separate issues.
    validations:
      required: false
