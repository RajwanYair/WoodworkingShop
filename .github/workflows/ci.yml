name: CI

on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
  workflow_dispatch:

permissions:
  contents: read

# Cancel in-progress runs for the same ref on new pushes
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-node
      - name: Quality checks (parallel)
        run: npm run quality:fast
      - name: MCP governance validation
        run: npm run mcp:validate
      - name: Component boundary budget
        run: npm run components:budget
      # Spell check disabled: cspell configuration not reliably picked up in GitHub Actions environments
      # Spell check is maintained separately and does not block CI/CD
      # - name: Spell check
      #   run: npx --yes cspell lint --no-progress --show-suggestions --gitignore "**/*.{ts,tsx,md}"
  test:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-node
      - run: npm test && npm run test:coverage
      # Coverage upload is best-effort; CI should not fail if Codecov is unavailable (network, quota, etc.)
      # Test execution itself is blocking (npm test must pass before reaching this step)
      - uses: codecov/codecov-action@v5
        with: { files: /tmp/WoodworkingShop/coverage/lcov.info, flags: unit, fail_ci_if_error: false }
      - run: npm run bench:check && npm run build && npm run bundle:check
      - uses: actions/upload-artifact@v4
        with: { name: dist, path: dist, retention-days: 7 }
  compat:
    runs-on: ubuntu-latest
    needs: quality
    strategy:
      fail-fast: false
      matrix: { node-version: [24, 26] }
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-node
        with: { node-version: '${{ matrix.node-version }}' }
      - uses: actions/cache@v5
        with:
          path: /tmp/WoodworkingShop/.vite_cache
          key: "vite-${{ runner.os }}-node${{ matrix.node-version }}-${{ hashFiles('vite.config.ts', 'package-lock.json') }}"
          restore-keys: 'vite-${{ runner.os }}-node${{ matrix.node-version }}-'
      - run: npm run build && npm run bundle:check
  e2e:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-node
      - uses: actions/cache@v5
        with: { path: ~/.cache/ms-playwright, key: "pw-${{ runner.os }}-${{ hashFiles('package-lock.json') }}" }
      - run: npx playwright install --with-deps chromium firefox
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist }
      - run: npx playwright test --ignore-snapshots
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: playwright-report, path: playwright-report/, retention-days: 7 }
  lighthouse:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-node
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist }
      - run: npm run lighthouse
        env: { LHCI_GITHUB_APP_TOKEN: '${{ secrets.LHCI_GITHUB_APP_TOKEN }}' }
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: lighthouse-report, path: .lighthouseci/, retention-days: 7 }
