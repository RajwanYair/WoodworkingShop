name: CI

on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: ./.github/actions/setup-node
      - name: Quality checks (parallel)
        run: |
          npm run typecheck & p1=$!
          npm run lint & p2=$!
          npm run lint:css & p3=$!
          npm run lint:md & p4=$!
          npm run format:check & p5=$!
          npm run i18n:coverage & p6=$!
          failed=0
          for pid in $p1 $p2 $p3 $p4 $p5 $p6; do wait "$pid" || failed=1; done
          exit $failed

  test:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: ./.github/actions/setup-node
      - run: npm test
      - run: npm run test:coverage
      - uses: codecov/codecov-action@v5
        with:
          files: /tmp/WoodworkingShop/coverage/lcov.info
          flags: unit
          fail_ci_if_error: false
      - run: npm run bench:check
      - run: npm run build && npm run bundle:check
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  compat:
    runs-on: ubuntu-latest
    needs: quality
    strategy:
      fail-fast: false
      matrix: { node-version: [24, 26] }
    steps:
      - uses: ./.github/actions/setup-node
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm run build && npm run bundle:check

  e2e:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: ./.github/actions/setup-node
      - id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - id: pw-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium firefox
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - run: npx playwright test --ignore-snapshots
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  lighthouse:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: ./.github/actions/setup-node
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - run: npm run lighthouse
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: .lighthouseci/
          retention-days: 7
