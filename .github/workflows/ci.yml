name: CI

on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
  workflow_dispatch:

permissions:
  contents: read

# Cancel in-progress runs for the same ref on new pushes
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-node
      - name: Quality checks (parallel)
        run: npm run quality:fast
      - name: MCP governance validation
        run: npm run mcp:validate
      - name: Component boundary budget
        run: npm run components:budget
      # Spell check disabled: cspell configuration not reliably picked up in GitHub Actions environments
      # Spell check is maintained separately and does not block CI/CD
      # - name: Spell check
      #   run: npx --yes cspell lint --no-progress --show-suggestions --gitignore "**/*.{ts,tsx,md}"
  test:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-node
      - run: npm test && npm run test:coverage
      # Coverage upload is best-effort; CI should not fail if Codecov is unavailable (network, quota, etc.)
      # Test execution itself is blocking (npm test must pass before reaching this step)
      - uses: codecov/codecov-action@v5
        with: { files: /tmp/WoodworkingShop/coverage/lcov.info, flags: unit, fail_ci_if_error: false }
      - run: npm run bench:check && npm run build && npm run bundle:check
      - uses: actions/upload-artifact@v7
        with: { name: dist, path: dist, retention-days: 7 }
  e2e-build:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-node
      - run: npm run build:e2e
        env:
          TMPDIR: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
      - uses: actions/upload-artifact@v7
        with: { name: e2e-dist, path: dist, retention-days: 1 }
  compat:
    runs-on: ubuntu-latest
    needs: quality
    strategy:
      fail-fast: false
      matrix: { node-version: [24, 26] }
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-node
        with: { node-version: '${{ matrix.node-version }}' }
      - uses: actions/cache@v5
        with:
          path: /tmp/WoodworkingShop/.vite_cache
          key: "vite-${{ runner.os }}-node${{ matrix.node-version }}-${{ hashFiles('vite.config.ts', 'package-lock.json') }}"
          restore-keys: 'vite-${{ runner.os }}-node${{ matrix.node-version }}-'
      - run: npm run build && npm run bundle:check
  e2e:
    runs-on: ubuntu-latest
    needs: [test, e2e-build]
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-node
      - uses: actions/cache@v5
        with: { path: ~/.cache/ms-playwright, key: "pw-${{ runner.os }}-webkit-${{ hashFiles('package-lock.json') }}" }
      - run: npx playwright install --with-deps chromium firefox webkit
      - uses: actions/download-artifact@v8
        with: { name: e2e-dist, path: dist }
      - run: npx playwright test --shard=${{ matrix.shard }}/4 --grep-invert @visual
        env:
          TMPDIR: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-blob-${{ matrix.shard }}
          path: ${{ runner.temp }}/WoodworkingShop/blob-report/
          retention-days: 1
          if-no-files-found: ignore
  e2e-visual:
    runs-on: windows-latest
    needs: [test, e2e-build]
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-node
      - uses: actions/cache@v5
        with:
          path: ~\AppData\Local\ms-playwright
          key: pw-${{ runner.os }}-visual-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install chromium
      - uses: actions/download-artifact@v8
        with: { name: e2e-dist, path: dist }
      - run: npx playwright test --grep '@visual' --project=chromium
        env:
          TMPDIR: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-blob-visual
          path: ${{ runner.temp }}/WoodworkingShop/blob-report/
          retention-days: 1
          if-no-files-found: ignore
  e2e-report:
    if: ${{ !cancelled() }}
    needs: [e2e, e2e-visual]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-node
      - uses: actions/download-artifact@v8
        with:
          pattern: playwright-blob-*
          path: ${{ runner.temp }}/WoodworkingShop/all-blob-reports
          merge-multiple: true
      - name: Merge Playwright reports
        env:
          TMPDIR: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          PLAYWRIGHT_HTML_REPORT: ${{ runner.temp }}/WoodworkingShop/playwright-report
        run: |
          if compgen -G "${{ runner.temp }}/WoodworkingShop/all-blob-reports/*.zip" > /dev/null; then
            npx playwright merge-reports --config=playwright.config.ts --reporter=html "${{ runner.temp }}/WoodworkingShop/all-blob-reports"
          else
            echo "No Playwright shard reports were produced."
          fi
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: ${{ runner.temp }}/WoodworkingShop/playwright-report/
          retention-days: 7
          if-no-files-found: ignore
  lighthouse:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-node
      - uses: actions/download-artifact@v8
        with: { name: dist, path: dist }
      - run: npm run lighthouse
        env: { LHCI_GITHUB_APP_TOKEN: '${{ secrets.LHCI_GITHUB_APP_TOKEN }}' }
      - if: always()
        uses: actions/upload-artifact@v7
        with: { name: lighthouse-report, path: .lighthouseci/, retention-days: 7, if-no-files-found: ignore }
