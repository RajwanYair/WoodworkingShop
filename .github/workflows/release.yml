name: Release — Build & Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build SPA
    runs-on: ubuntu-latest
    steps:
      - uses: ./.github/actions/setup-node
      - run: npm run ci
      - run: npm run sbom
      - name: Archive + checksums
        run: |
          cd dist && tar -czf ../woodworkingshop-dist.tar.gz .
          cd .. && sha256sum woodworkingshop-dist.tar.gz > woodworkingshop-dist.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: woodworkingshop-dist
          path: |
            woodworkingshop-dist.tar.gz
            woodworkingshop-dist.tar.gz.sha256
            sbom.json

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: woodworkingshop-dist
      - id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi
      - id: changelog
        run: |
          ver="${{ steps.version.outputs.version }}" && ver="${ver#v}"
          notes=$(awk "/^## \\[${ver}\\]/{f=1;next} /^## \\[/{f=0} f" CHANGELOG.md)
          { echo "notes<<EOF"; echo "${notes:-Release ${ver}}"; echo "EOF"; } >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: WoodworkingShop ${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          files: |
            woodworkingshop-dist.tar.gz
            woodworkingshop-dist.tar.gz.sha256
            sbom.json
          body: |
            ${{ steps.changelog.outputs.notes }}

            ---

            ### Artifacts
            - **woodworkingshop-dist.tar.gz** — Production build (deploy to any static host)
            - **sbom.json** — CycloneDX Software Bill of Materials

            ### Run locally
            ```bash
            npm ci && npm run dev
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
