name: Mutation Testing

on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  mutation-baseline:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./.github/actions/setup-node
      - name: Prepare incremental state directory
        run: mkdir -p "$RUNNER_TEMP/WoodworkingShop/mutation"
      - name: Restore four-module incremental state
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/WoodworkingShop/mutation/stryker-incremental.json
          key: stryker-baseline-${{ runner.os }}-${{ github.ref_name }}-${{ hashFiles('package-lock.json', 'stryker.config.mjs', 'vitest.config.ts', 'tests/**/*.{ts,tsx}', 'src/engine/geometry/dimensions.ts', 'src/engine/geometry/parts.ts', 'src/engine/optimizer/cut-optimizer.ts', 'src/engine/core/validation.ts') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            stryker-baseline-${{ runner.os }}-${{ github.ref_name }}-${{ hashFiles('package-lock.json', 'stryker.config.mjs', 'vitest.config.ts', 'tests/**/*.{ts,tsx}', 'src/engine/geometry/dimensions.ts', 'src/engine/geometry/parts.ts', 'src/engine/optimizer/cut-optimizer.ts', 'src/engine/core/validation.ts') }}-
      - name: Run four-module incremental baseline slice
        env:
          STRYKER_INCREMENTAL_FILE: ${{ runner.temp }}/WoodworkingShop/mutation/stryker-incremental.json
        run: |
          set +e
          timeout --signal=INT --kill-after=60s 14m npm run test:mutation -- --incremental
          result=$?
          if [ "$result" -eq 124 ]; then
            echo "::notice::Mutation baseline slice paused after 14 minutes; incremental results will be cached for the next weekly run."
            exit 0
          fi
          exit "$result"
      - name: Save four-module incremental state
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/WoodworkingShop/mutation/stryker-incremental.json
          key: stryker-baseline-${{ runner.os }}-${{ github.ref_name }}-${{ hashFiles('package-lock.json', 'stryker.config.mjs', 'vitest.config.ts', 'tests/**/*.{ts,tsx}', 'src/engine/geometry/dimensions.ts', 'src/engine/geometry/parts.ts', 'src/engine/optimizer/cut-optimizer.ts', 'src/engine/core/validation.ts') }}-${{ github.run_id }}-${{ github.run_attempt }}
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: mutation-report
          path: /tmp/WoodworkingShop/mutation/
          retention-days: 14
          if-no-files-found: ignore

  mutation-weekly:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./.github/actions/setup-node
      - name: Run bounded weekly mutation gate
        run: npm run test:mutation -- stryker.weekly.config.mjs
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: mutation-weekly-report
          path: /tmp/WoodworkingShop/mutation/
          retention-days: 14
          if-no-files-found: ignore
