version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 10
    assignees:
      - 'RajwanYair'
    labels:
      - 'dependencies'
    commit-message:
      prefix: 'chore(deps)'
    # Group related packages into a single PR to reduce noise.
    groups:
      react:
        patterns: ['react', 'react-dom', '@types/react*']
      vite:
        patterns: ['vite', '@vitejs/*', '@tailwindcss/vite', 'tailwindcss']
      eslint:
        patterns: ['eslint*', '@eslint/*', 'eslint-plugin-*', 'eslint-config-*']
      testing:
        patterns: ['vitest', '@vitest/*', '@playwright/*', '@testing-library/*', 'axe-core']
      typescript:
        patterns: ['typescript*', 'typescript-eslint', '@types/*']
      pdf:
        patterns: ['@react-pdf/*']

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 5
    assignees:
      - 'RajwanYair'
    labels:
      - 'ci'
    commit-message:
      prefix: 'chore(ci)'
