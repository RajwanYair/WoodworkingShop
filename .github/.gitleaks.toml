# gitleaks config — Sprint 84
# Built on top of the bundled default ruleset so all common provider
# patterns (AWS, GitHub, Slack, Stripe, Generic API keys, JWTs, etc.)
# remain active. Customise via [extend] and [allowlist] below.

title = "WoodworkingShop gitleaks ruleset"

[extend]
useDefault = true

[allowlist]
description = "Global allowlist for known-safe matches"
# Skip vendor/build/test fixture trees entirely.
paths = [
  '''(.*?)node_modules(.*?)''',
  '''(.*?)dist(.*?)''',
  '''(.*?)coverage(.*?)''',
  '''(.*?)test-results(.*?)''',
  '''(.*?)playwright-report(.*?)''',
  '''package-lock\.json''',
]
# Common placeholder / example tokens that should never trip a finding.
regexes = [
  '''ghp_[xX]{20,}''',
  '''sk-[xX]{20,}''',
  '''AKIA[xX]{16}''',
  '''EXAMPLE[_-]?KEY''',
  '''YOUR[_-]?TOKEN[_-]?HERE''',
  # i18n label keys in validation engine (e.g. fixUsePlywood18) — not secrets
  '''labelKey:\s*['"]fix[A-Za-z0-9]+['"]''',
  # Validation rule IDs — high-entropy kebab-case identifiers used as rule keys
  # in src/engine/validation*.ts.  Pattern: quoted all-caps+hyphen strings ≥16 chars.
  '''['"][A-Z][A-Z0-9_\-]{15,}['"]''',
]
