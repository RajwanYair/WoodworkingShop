name: 'Setup Node & Install'
description: 'Checkout repo, configure Node.js, and run npm ci — eliminates repetition across all CI jobs.'
inputs:
  node-version:
    description: 'Node.js version to use'
    required: false
    default: '24'
  fetch-depth:
    description: 'Number of commits to fetch. 0 fetches all history. Default 1 for fast shallow clone.'
    required: false
    default: '1'
runs:
  using: composite
  steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: ${{ inputs.fetch-depth }}

    - uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm

    - run: npm ci --prefer-offline --no-fund --no-audit
      shell: bash
