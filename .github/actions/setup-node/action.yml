name: 'Setup Node & Install'
description: 'Configure Node.js and run npm ci — checkout must be done by the calling workflow before invoking this action.'
inputs:
  node-version:
    description: 'Node.js version to use'
    required: false
    default: '24'
  npm-cache-dir:
    description: 'Absolute npm cache directory used during npm ci'
    required: false
    default: '/tmp/WoodworkingShop/npm-cache'
  npm-ci-args:
    description: 'Additional npm ci flags'
    required: false
    default: '--prefer-offline --no-fund --no-audit'
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v5
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm

    - run: mkdir -p "${{ inputs.npm-cache-dir }}"
      shell: bash

    - run: npm ci ${{ inputs.npm-ci-args }}
      shell: bash
      env:
        NPM_CONFIG_CACHE: ${{ inputs.npm-cache-dir }}
