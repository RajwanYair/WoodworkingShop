---
# GitHub Discussions template — Ideas & Feature Requests
# Path: .github/DISCUSSION_TEMPLATE/ideas.yml

title: '[Idea] '
labels: ['enhancement', 'discussion']
body:
  - type: markdown
    attributes:
      value: |
        ## 💡 Share Your Idea
        Thanks for taking the time to suggest a feature for **Cabinet Planner**!
        The more detail you provide, the easier it is to evaluate and implement.

  - type: textarea
    id: summary
    attributes:
      label: Feature Summary
      description: A one-sentence description of what you want to add or change.
      placeholder: 'e.g. Add a corner cabinet template with blind-corner pull-out hardware'
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem or Use Case
      description: What workflow or pain-point does this address?
      placeholder: 'When I design a kitchen I often need corner cabinets, and currently I have to approximate them manually…'
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe what the feature would look like or how it would work.
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Have you found any workarounds? Are there other tools that do this?
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Feature Area
      options:
        - Configurator / dimensions
        - Materials & cost
        - Cut-sheet optimizer
        - SVG preview
        - Export (PDF / DXF / G-code / CSV)
        - Assembly guide
        - PWA / offline
        - i18n / accessibility
        - CI / DevOps
        - Other
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-submission Checklist
      options:
        - label: I searched existing issues and discussions — this is not a duplicate
          required: true
        - label: I checked the [Roadmap](https://github.com/RajwanYair/WoodworkingShop/blob/main/ROADMAP.md) — this is not already planned
          required: false
