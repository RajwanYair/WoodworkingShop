<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Wood-themed cabinet icon: warm brown carcass with two doors and grain hint -->
  <defs>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a07042"/>
      <stop offset="100%" stop-color="#5a4218"/>
    </linearGradient>
  </defs>
  <!-- Carcass -->
  <rect x="6" y="6" width="52" height="52" rx="3" fill="url(#wood)" stroke="#3a2a10" stroke-width="2"/>
  <!-- Mid stile -->
  <rect x="31" y="10" width="2" height="44" fill="#3a2a10"/>
  <!-- Left door inset -->
  <rect x="10" y="10" width="20" height="44" fill="none" stroke="#3a2a10" stroke-width="1.5" rx="1"/>
  <!-- Right door inset -->
  <rect x="34" y="10" width="20" height="44" fill="none" stroke="#3a2a10" stroke-width="1.5" rx="1"/>
  <!-- Knobs -->
  <circle cx="26" cy="32" r="1.6" fill="#eacb8a"/>
  <circle cx="38" cy="32" r="1.6" fill="#eacb8a"/>
  <!-- Grain lines -->
  <path d="M12 18 Q20 20 28 18" stroke="#7a5828" stroke-width="0.6" fill="none" opacity="0.5"/>
  <path d="M12 46 Q20 44 28 46" stroke="#7a5828" stroke-width="0.6" fill="none" opacity="0.5"/>
  <path d="M36 24 Q44 22 52 24" stroke="#7a5828" stroke-width="0.6" fill="none" opacity="0.5"/>
  <path d="M36 40 Q44 42 52 40" stroke="#7a5828" stroke-width="0.6" fill="none" opacity="0.5"/>
</svg>
