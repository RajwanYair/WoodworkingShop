<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#5a4218" />
    <title>Cabinet Planner — Offline</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #faf7f2;
        color: #3d2e0a;
        padding: 1.5rem;
      }
      .container {
        text-align: center;
        max-width: 28rem;
      }
      .icon {
        font-size: 3rem;
        margin-bottom: 1rem;
      }
      h1 {
        font-size: 1.5rem;
        margin-bottom: 0.5rem;
      }
      p {
        color: #6b5c3e;
        margin-bottom: 1.5rem;
        line-height: 1.5;
      }
      button {
        background: #5a4218;
        color: #fff;
        border: none;
        border-radius: 0.5rem;
        padding: 0.75rem 1.5rem;
        font-size: 1rem;
        cursor: pointer;
        transition: background 0.2s;
      }
      button:hover {
        background: #3d2e0a;
      }
      button:focus-visible {
        outline: 2px solid #5a4218;
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main class="container" role="main">
      <div class="icon" aria-hidden="true">📡</div>
      <h1>You're offline</h1>
      <p>
        Cabinet Planner needs an internet connection to load for the first time. Once loaded, most features work
        offline.
      </p>
      <button type="button" onclick="window.location.reload()">Try again</button>
    </main>
  </body>
</html>
